name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4 # also updated

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable
        run: |
          pyinstaller --onefile --noconsole --name AirBeam `
          --add-data "airbeam/static;static" `
          --add-data "airbeam/templates;templates" `
          airbeam/main.py

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeam-windows
          path: dist/AirBeam.exe
          retention-days: 7
